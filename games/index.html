<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="robots" content="noindex" />
    <title>Arcade Interrupt | Brian Birkinbine</title>
    <meta name="description" content="A hidden arcade cabinet featuring five vector programs and the pixel-scrolling ORIGIN FLIGHT." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=VT323&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="arcade.css?v=20260924-13" />
    <script>
      (() => {
        const renderedVersion = '20260924-13';
        const versionUrl = new URL('version.json', window.location.href);
        versionUrl.searchParams.set('refresh', Date.now());

        fetch(versionUrl, { cache: 'no-store' })
          .then((response) => (response.ok ? response.json() : null))
          .then((latest) => {
            if (!latest || typeof latest.version !== 'string' || latest.version === renderedVersion) {
              return;
            }

            const pageUrl = new URL(window.location.href);
            if (pageUrl.searchParams.get('v') === latest.version) {
              return;
            }
            pageUrl.searchParams.set('v', latest.version);
            window.location.replace(pageUrl);
          })
          .catch(() => {});
      })();
    </script>
    <script type="module" src="arcade.mjs?v=20260924-13"></script>
  </head>
  <body>
    <main class="arcade-shell">
      <header class="cabinet-header">
        <div>
          <p class="eyebrow">ARCADE INTERRUPT // SELECT PROGRAM</p>
          <h1 id="game-title">SELECT GAME</h1>
        </div>
        <div class="hud" aria-live="polite">
          <span>SCORE <strong id="score">000000</strong></span>
          <span>SHIPS <strong id="lives">03</strong></span>
        </div>
      </header>

      <section class="screen-frame" aria-label="Hidden arcade game">
        <canvas id="game-canvas" width="800" height="480" tabindex="0">
          Your browser does not support the canvas element.
        </canvas>
        <div class="screen-glass" aria-hidden="true"></div>
        <nav id="game-menu" class="game-menu" aria-label="Choose a game">
          <p class="menu-prompt">SELECT PROGRAM</p>
          <div class="game-list">
            <button type="button" data-game-id="vector-break">
              <strong>VECTOR BREAK</strong>
              <span>Breach six shifting defenses</span>
            </button>
            <button type="button" data-game-id="vector-snake">
              <strong>VECTOR SNAKE</strong>
              <span>Grow without crossing your trail</span>
            </button>
            <button type="button" data-game-id="vector-invaders">
              <strong>VECTOR INVADERS</strong>
              <span>Defend the last sector</span>
            </button>
            <button type="button" data-game-id="vector-asteroids">
              <strong>VECTOR ASTEROIDS</strong>
              <span>Survive the debris field</span>
            </button>
            <button type="button" data-game-id="vector-lander">
              <strong>VECTOR LANDER</strong>
              <span>Six fuel-balanced mountain missions</span>
            </button>
            <button type="button" data-game-id="origin-flight">
              <strong>ORIGIN FLIGHT</strong>
              <span>Power up through the scrolling sector</span>
            </button>
          </div>
          <p class="menu-help">ARROWS / WASD TO CHOOSE &nbsp; ENTER / SPACE TO PLAY &nbsp; ESC TO RETURN HOME</p>
        </nav>
      </section>

      <div class="cabinet-controls">
        <p id="instructions">SELECT: ARROWS / WASD &nbsp; PLAY: ENTER OR SPACE &nbsp; ESC: RETURN HOME</p>
        <div class="button-row">
          <button id="game-menu-button" type="button">GAME MENU</button>
          <a href="../index.html">RETURN HOME</a>
        </div>
      </div>

      <div class="touch-controls" aria-label="Touch controls">
        <button type="button" data-control="left" aria-label="Move left">◀</button>
        <button type="button" data-control="up" aria-label="Move up">▲</button>
        <button type="button" data-control="down" aria-label="Move down">▼</button>
        <button type="button" data-control="right" aria-label="Move right">▶</button>
        <button class="touch-action" type="button" data-control="action">FIRE</button>
      </div>
    </main>
  </body>
</html>
